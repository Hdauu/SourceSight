name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./pkg/core ./pkg/modules ./pkg/parser ./pkg/update ./pkg/history ./pkg/evidence ./pkg/db ./pkg/steamid ./pkg/launcher ./pkg/testenv
      - run: go test ./...
      - run: go build ./...

  # Demos are analyzed in parallel: the race detector checks that the analysis code
  # shares no state. It needs cgo, so it runs on Linux with the portable packages
  # (the window and launcher code is Windows-only).
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./pkg/core ./pkg/modules ./pkg/parser ./pkg/history ./pkg/db ./pkg/steamid ./pkg/appdata ./pkg/evidence ./pkg/update
        env:
          CGO_ENABLED: "1"
