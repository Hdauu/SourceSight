name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./pkg/core ./pkg/modules ./pkg/parser ./pkg/update ./pkg/history ./pkg/evidence
      - run: go test ./...
      - run: go build ./...
